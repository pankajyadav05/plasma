<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP note:
      - script-src includes 'unsafe-eval' + 'unsafe-inline' + blob: because
        Monaco Editor (loaded via @monaco-editor/react) requires eval/Function
        and creates blob-URL workers for its background threads.
      - connect-src + style-src include https://cdn.jsdelivr.net because
        @monaco-editor/react's default loader fetches Monaco from jsDelivr.
      - worker-src blob: is needed for Monaco's web workers.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-eval' 'unsafe-inline' blob: https://cdn.jsdelivr.net;
        worker-src 'self' blob: data:;
        style-src 'self' 'unsafe-inline' https://fonts.bunny.net https://cdn.jsdelivr.net;
        font-src 'self' https://fonts.bunny.net data:;
        img-src 'self' data: blob:;
        connect-src 'self' ws: http://localhost:* https://cdn.jsdelivr.net;
      "
    />
    <title>Plasma</title>

    <!-- Favicons. SVG is primary (scales perfectly in modern Chromium);
         PNG variants are for legacy platforms and apple-touch-icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#7B2D26" />

    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css?family=newsreader:400,400i,500,500i|dm-sans:400,500,600|jetbrains-mono:400,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
