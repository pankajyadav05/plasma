<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Production CSP (C16). Monaco and every font are bundled locally, so
      nothing is loaded from a CDN and scripts need neither inline code nor
      eval. Monaco's workers are inlined as blob: URLs (worker-src blob:);
      its widgets set inline styles ('unsafe-inline' for style-src only).
      The dev server relaxes script-src/connect-src for React Refresh + HMR
      (see devCspPlugin in electron.vite.config.ts).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        worker-src 'self' blob:;
        style-src 'self' 'unsafe-inline';
        font-src 'self' data:;
        img-src 'self' data: blob:;
        connect-src 'self';
        object-src 'none';
        base-uri 'none';
        form-action 'none';
        frame-src 'none';
      "
    />
    <title>Plasma</title>

    <!-- Favicons. SVG is primary (scales perfectly in modern Chromium);
         PNG variants are for legacy platforms and apple-touch-icon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#7B2D26" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
