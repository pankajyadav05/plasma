# Keep this file as-is: CI installs with pnpm 9, which needs `packages`, and
# `electron: true` is what lets electron download its binary. Newer pnpm
# versions (e.g. `pnpm approve-builds`) may rewrite it; restore it if so.
packages:
  - "."
blockExoticSubdeps: false
# pnpm 11+ build approval (replaces the package.json "pnpm.onlyBuiltDependencies"
# list, which pnpm 12 ignores; that field stays for pnpm 9/10 compat)
allowBuilds:
  electron: true
  esbuild: true
  "@biomejs/biome": true
  # Ships N-API prebuilds for every platform; compiling it is pointless and
  # fails on runners whose Visual Studio node-gyp doesn't recognise.
  better-sqlite3: false
  ssh2: true
  electron-winstaller: true
  cpu-features: false
ignoredOptionalDependencies:
  - cpu-features
# DuckDB ships one optional package per platform (@duckdb/node-bindings-<os>-<cpu>).
# A macOS runner packages both arm64 and x64, so every platform's binding is
# installed; electron-builder.yml keeps only the target's in each artifact.
supportedArchitectures:
  os: [current, darwin, linux, win32]
  cpu: [current, x64, arm64]
overrides:
  # @electron/rebuild bundles a node-abi that predates Electron 44's ABI.
  node-abi@^4: ^4.35.0
  # electron-updater's js-yaml has quadratic-CPU DoS advisories below 4.3.2.
  js-yaml@^4: "^4.3.2"
