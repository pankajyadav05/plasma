<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" role="img" aria-label="Plasma (monochrome ink)">
  <title>Plasma</title>
  <defs>
    <style>
      .ink { fill: #1C1A14; }
      .wordmark {
        font-family: 'Newsreader', 'Georgia', 'Times New Roman', serif;
        font-style: italic;
        font-weight: 500;
        font-size: 120px;
        letter-spacing: -1px;
      }
    </style>
  </defs>
  <!-- Everything in ink — for use on light backgrounds where the accent color isn't desired. -->
  <text x="24" y="108" class="wordmark ink">Plasma</text>
  <rect x="24" y="122" width="360" height="4" class="ink"/>
</svg>
