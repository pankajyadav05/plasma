appId: sh.plasma.app
productName: Plasma
copyright: Copyright © 2026
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  output: release
  buildResources: resources

# Ship the built main/preload/renderer plus the native pg + better-sqlite3.
# Exclude source, tests, configs, and anything else that shouldn't ride along.
files:
  - out/**/*
  - package.json
  - "!**/*.map"
  - "!**/node_modules/**/{CHANGELOG.md,README.md,readme.md,readme}"
  - "!**/node_modules/**/{test,tests,__tests__,__mocks__,example,examples,docs,.github}/**"
  - "!**/{.eslintrc,.eslintignore,.prettierrc,.editorconfig,tsconfig*.json,tslint.json,rollup.config*}"

# better-sqlite3 ships a prebuilt .node binary — it must NOT live inside the
# asar archive because Node's native loader can't dlopen from inside asar.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

# Rebuild native modules against Electron's ABI, per target arch, at package
# time. Required for better-sqlite3: a single node_modules can only hold one
# arch's binary, and macOS ships both arm64 and x64 from one build — so the
# rebuild MUST happen during packaging (electron-builder stages node_modules
# per arch and rebuilds against each target). The postinstall hook only
# covers the local dev ABI; `install-app-deps` in CI would rebuild just the
# host arch and leave the other arch's package broken.
nodeGypRebuild: false
buildDependenciesFromSource: false
npmRebuild: true

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Plasma
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}

# ── macOS ─────────────────────────────────────────────────────────────
# Two artifacts per arch:
#   .dmg — what users download & drag to /Applications.
#   .zip — what electron-updater consumes for delta updates on macOS
#          (the .dmg is not a valid auto-update payload on this platform).
#
# Targets both arm64 (Apple Silicon) and x64 (Intel). electron-builder
# will run lipo on better-sqlite3's prebuilt binaries automatically.
#
# `identity: null` produces an unsigned build so `pnpm run dist:mac`
# works on a stock developer machine without an Apple Developer ID in
# the keychain. Trade-off: Gatekeeper will quarantine the .app on first
# launch — users right-click → Open, or run
#   xattr -cr /Applications/Plasma.app
# To ship signed + notarized builds, replace `identity: null` with the
# Developer ID Application string and add notarize config (see
# https://www.electron.build/code-signing-mac).
#
# Auto-update on macOS requires a signed build — without signing,
# electron-updater will surface the "available" event but the install
# step will fail. The renderer's update UI handles the error gracefully.
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  category: public.app-category.developer-tools
  icon: resources/icon-1024.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: null

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Two-pane layout: Plasma.app on the left, /Applications shortcut on
  # the right. Standard macOS install affordance.
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Auto-update (electron-updater) ────────────────────────────────────
# Generic provider — `latest.yml` + the installer + its .blockmap live
# at the same URL space (Cloudflare R2 public bucket). Builder
# emits these manifest files alongside the artifacts; the upload
# script ships them. Only the NSIS installer can self-update; the
# portable EXE will surface the available-update event but the user
# has to re-download manually.
publish:
  - provider: generic
    url: https://pub-05a2064511bc41689f299b542b07b67f.r2.dev
    channel: latest
    useMultipleRangeRequest: false
