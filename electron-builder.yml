appId: sh.plasma.app
productName: Plasma
copyright: Copyright © 2026
artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  output: release
  buildResources: resources

# Ship the built main/preload/renderer plus the runtime dependencies (the
# `dependencies` in package.json: pg, ioredis, better-sqlite3, ...). The
# renderer is bundled by Vite, so its libraries live in devDependencies and
# never ride along. Exclude source, tests, configs and unneeded binaries.
files:
  - out/**/*
  - package.json
  # better-sqlite3 loads prebuilds/<platform>-<arch>.node; ship only the
  # target OS's. macOS keeps both archs (each arch is packaged separately and
  # the loader picks by process.arch).
  - "!**/node_modules/better-sqlite3/{deps,src,build}/**"
  - "!**/node_modules/better-sqlite3/binding.gyp"
  - "!**/*.map"
  - "!**/node_modules/**/{CHANGELOG.md,README.md,readme.md,readme}"
  - "!**/node_modules/**/{test,tests,__tests__,__mocks__,example,examples,docs,.github}/**"
  - "!**/{.eslintrc,.eslintignore,.prettierrc,.editorconfig,tsconfig*.json,tslint.json,rollup.config*}"

# The BrowserWindow icon (src/main/window.ts reads <resources>/icon.png);
# matters on Linux/Windows, where the window icon is not taken from the bundle.
extraResources:
  - from: resources/icon.png
    to: icon.png
  # The `plasma` command-line launcher (Settings -> Install command-line tool
  # links it into PATH). Shipped as plain scripts, outside the asar.
  - from: bin/plasma
    to: bin/plasma
  - from: bin/plasma.cmd
    to: bin/plasma.cmd

# plasma:// deep links: macOS Info.plist CFBundleURLTypes, the Windows registry
# entry written by the installer, and the Linux .desktop MimeType
# (x-scheme-handler/plasma, see linux.mimeTypes below).
protocols:
  - name: Plasma
    schemes:
      - plasma

# better-sqlite3 ships prebuilt N-API .node binaries (prebuilds/<os>-<arch>.node)
# — they must NOT live inside the asar archive because Node's native loader
# can't dlopen from inside asar.
asarUnpack:
  - "**/node_modules/better-sqlite3/prebuilds/*.node"
  # DuckDB: the binding is a .node that loads libduckdb next to it (.so / .dylib /
  # .dll), so the whole per-platform package must live outside the asar.
  - "**/node_modules/@duckdb/node-bindings-*/**"

# No native rebuild at package time. better-sqlite3 13 ships N-API prebuilds
# for every platform/arch and loads them first; N-API binaries run in Electron
# unchanged, so there is nothing to compile (and no VS/Xcode toolchain to break
# the Windows build). ssh2's optional cpu-features is ignored (package.json).
nodeGypRebuild: false
buildDependenciesFromSource: false
npmRebuild: false

# Electron fuses (SC-28) are flipped in scripts/after-pack.cjs (same values for
# every platform, mac re-signed ad-hoc afterwards), not with `electronFuses`
# here: on Linux the hook also renames the Electron binary, and electron-builder
# flips fuses after afterPack. Verify a packaged app with
# `node scripts/verify-fuses.mjs <path-to-binary>` (Linux: plasma.bin).
afterPack: scripts/after-pack.cjs

win:
  # Platform `files` must lead with a positive pattern: a list that starts with
  # `!` gets `**/*` prepended and would pull the whole repo into the asar.
  files:
    - out/**/*
    - package.json
    - "!**/node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*.node"
    - "!**/node_modules/@duckdb/node-bindings-{darwin,linux}-*/**"
    - "!**/node_modules/@duckdb/node-bindings-win32-arm64/**"
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: resources/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  # ── Code signing (C20) ──────────────────────────────────────────────
  # Updates come from a public bucket, and latest.yml's sha512 sits next
  # to the installer, so only a signature proves who published an update.
  # To enable verified auto-update:
  #   1. Provide an Authenticode certificate to the build (CSC_LINK +
  #      CSC_KEY_PASSWORD, or an Azure Trusted Signing config).
  #   2. Uncomment publisherName with the certificate's exact subject CN.
  # electron-builder then writes publisherName into app-update.yml and
  # electron-updater rejects any installer whose signature doesn't match.
  # src/main/updater.ts reads that value: without it, updates are still
  # downloaded but only installed on an explicit "Restart & install".
  # signtoolOptions:
  #   publisherName: "Your Legal Entity Name"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Plasma
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}

# ── macOS ─────────────────────────────────────────────────────────────
# Two artifacts per arch:
#   .dmg — what users download & drag to /Applications.
#   .zip — what electron-updater consumes for delta updates on macOS
#          (the .dmg is not a valid auto-update payload on this platform).
#
# Apple Silicon (arm64) only: Intel Macs are not supported from 3.1.2.
# The x64 native bindings are left out of the bundle below.
#
# Signed with the "Developer ID Application: Pankaj Yadav (88LKBXATSW)"
# certificate. `identity` is left unset so electron-builder auto-discovers the
# Developer ID in the login keychain (CSC_NAME / CSC_LINK + CSC_KEY_PASSWORD
# override it). Where no certificate is available (CI sets
# CSC_IDENTITY_AUTO_DISCOVERY=false) the build stays unsigned, with the ad-hoc
# signature from after-pack.cjs, exactly as before.
#
# Notarization runs after signing when Apple credentials are in the env, and
# is skipped (with a warning) otherwise. Any one of:
#   APPLE_KEYCHAIN_PROFILE  (xcrun notarytool store-credentials <profile> ...)
#   APPLE_API_KEY + APPLE_API_KEY_ID + APPLE_API_ISSUER
#   APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID
# A signed but un-notarized build is still blocked by Gatekeeper on download,
# so a release must be notarized (`pnpm release:mac` checks).
#
# Hardened runtime uses electron-builder's default entitlements (JIT,
# unsigned executable memory, disabled library validation for native modules).
#
# Why signing matters for updates (C20): Squirrel.Mac validates each download
# against the designated requirement of the installed app. Ad-hoc builds have
# no requirement a later release can satisfy, so those apps update through
# Plasma's own installer (src/main/mac-self-update.ts); a Developer ID build
# is classified `certificate` by src/main/mac-signature.ts and goes through
# Squirrel, which only installs an update signed by the same team.
mac:
  # Platform `files` must lead with a positive pattern: a list that starts with
  # `!` gets `**/*` prepended and would pull the whole repo into the asar.
  files:
    - out/**/*
    - package.json
    - "!**/node_modules/better-sqlite3/prebuilds/{win32,linux,linuxmusl,darwin-x64}*.node"
    - "!**/node_modules/@duckdb/node-bindings-{win32,linux,darwin-x64}*/**"
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  category: public.app-category.developer-tools
  icon: resources/icon-1024.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false

# ── Linux ─────────────────────────────────────────────────────────────
# AppImage self-updates (latest-linux.yml); the deb is a manual install.
linux:
  # Platform `files` must lead with a positive pattern: a list that starts with
  # `!` gets `**/*` prepended and would pull the whole repo into the asar.
  files:
    - out/**/*
    - package.json
    - "!**/node_modules/better-sqlite3/prebuilds/{darwin,win32,linuxmusl}-*.node"
    - "!**/node_modules/better-sqlite3/prebuilds/linux-arm64.node"
    - "!**/node_modules/@duckdb/node-bindings-{darwin,win32}-*/**"
    - "!**/node_modules/@duckdb/node-bindings-linux-arm64*/**"
    - "!**/node_modules/@duckdb/node-bindings-linux-x64-musl/**"
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Development
  icon: resources/icon-512.png
  maintainer: Plasma <noreply@plasma.sh>
  artifactName: ${productName}-${version}-${arch}.${ext}
  executableName: plasma
  # x-scheme-handler/plasma in the generated .desktop file, so the desktop
  # routes plasma:// links to the app (Exec already ends in %U).
  mimeTypes:
    - x-scheme-handler/plasma

appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Installed on Ubuntu 24.04+ so the Chromium sandbox can use user
  # namespaces; it attaches to the launcher and to plasma.bin.
  appArmorProfile: build/apparmor-profile
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Two-pane layout: Plasma.app on the left, /Applications shortcut on
  # the right. Standard macOS install affordance.
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications

# ── Auto-update (electron-updater) ────────────────────────────────────
# Generic provider — `latest.yml` + the installer + its .blockmap live
# at the same URL space (Cloudflare R2 public bucket). Builder
# emits these manifest files alongside the artifacts; the upload
# script ships them. Only the NSIS installer can self-update; the
# portable EXE will surface the available-update event but the user
# has to re-download manually.
publish:
  - provider: generic
    url: https://pub-05a2064511bc41689f299b542b07b67f.r2.dev
    channel: latest
    useMultipleRangeRequest: false
