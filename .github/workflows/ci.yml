name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    env:
      # No app is launched here — typecheck and the unit suite are pure Node,
      # so the ~100MB Electron binary download is dead weight.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  lint:
    name: Lint (Biome)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint

  # The opt-in PLASMA_LIVE_* suites run against real servers. Each test file
  # reads its own variable (grep PLASMA_LIVE src/): PG takes a connection URL,
  # Redis and OpenSearch take the server URL. The Redis suite FLUSHALLs, so
  # the service container is throwaway by construction.
  live-tests:
    name: Live driver tests (Postgres, Redis, OpenSearch, MySQL)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      PLASMA_LIVE_PG: postgres://postgres:plasma-ci-s3cret@127.0.0.1:5432/postgres
      PLASMA_LIVE_REDIS: redis://127.0.0.1:6379
      PLASMA_LIVE_OS: http://127.0.0.1:9200
      # mysql.live.test.ts creates and drops its own database on this server.
      PLASMA_LIVE_MYSQL: "1"
      PLASMA_MYSQL_HOST: 127.0.0.1
      PLASMA_MYSQL_PORT: 3306
      PLASMA_MYSQL_USER: root
      PLASMA_MYSQL_PASSWORD: mysql
      # clickhouse.live.test.ts creates and drops its own database on this server.
      PLASMA_LIVE_CLICKHOUSE: "1"
      PLASMA_CLICKHOUSE_HOST: 127.0.0.1
      PLASMA_CLICKHOUSE_PORT: 8123
      PLASMA_CLICKHOUSE_USER: default
      PLASMA_CLICKHOUSE_PASSWORD: clickhouse
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Distinctive on purpose: leak checks search for the password text.
          POSTGRES_PASSWORD: plasma-ci-s3cret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: clickhouse
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget -q --spider http://127.0.0.1:8123/ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      opensearch:
        image: opensearchproject/opensearch:2.17.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pg-admin.live.test.ts shells out to pg_dump / pg_restore / psql.
      - name: Install Postgres client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Wait for OpenSearch
        run: |
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:9200/_cluster/health && exit 0
            sleep 2
          done
          echo "::error::OpenSearch did not become healthy"
          exit 1
      - name: Live tests
        # github-actions reporter turns failures into annotations, readable
        # without repo-admin access.
        shell: bash
        run: |
          set +e
          npx vitest run --reporter=default --reporter=github-actions --reporter=json --outputFile=live-results.json 2>&1 | tee live.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            # Unhandled errors and suite-level failures aren't annotated by the
            # github-actions reporter; surface them too.
            node -e "const r=require('./live-results.json');const bad=r.testResults.filter(t=>t.status!=='passed').map(t=>t.name+': '+(t.message||'').slice(0,300));console.log('::error title=live summary::failed='+r.numFailedTests+' suites='+r.numFailedTestSuites+'%0A'+bad.join('%0A').replace(/\n/g,' '))" || true
            grep -n -A8 -E "Unhandled|Error:" live.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > err.txt
            echo "::error title=live errors::$(cat err.txt)"
          fi
          exit $code

  # `pnpm install` is where Windows and macOS releases used to break (native
  # rebuilds, postinstall spawning .cmd files). Run it for real on both, with
  # CI unset for the postinstall step so the Electron-binary path executes too.
  install-smoke:
    name: Install smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        shell: bash
        # On failure, surface the tail of the log as annotations (readable
        # without repo-admin access, unlike job logs).
        run: |
          set -o pipefail
          if ! pnpm install --frozen-lockfile --reporter=append-only 2>&1 | tee install.log; then
            tail -n 60 install.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > tail.txt
            echo "::error title=pnpm install failed::$(cat tail.txt)"
            exit 1
          fi
      - name: Run postinstall as a developer would (CI unset)
        shell: bash
        run: env -u CI node scripts/postinstall.mjs
      - name: better-sqlite3 prebuild loads
        run: node -e "const D=require('better-sqlite3');const d=new D(':memory:');console.log(d.prepare('select sqlite_version() v').get())"
      - name: Build
        run: pnpm run build

  site:
    name: Site typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Same install Vercel runs (site/vercel.json).
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm exec tsc --noEmit
