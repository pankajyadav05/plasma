name: Release

# Build, smoke-test, sign and publish from GitHub. Started by hand from the
# Actions tab (Run workflow), and it only PUBLISHES to the production update
# feed from `main` or from a `v*` tag whose version equals package.json (see
# the `guard` job). Local releases (pnpm release:mac / release:ship) still work.
#
# `platforms` picks what to build and publish. From `main` the version is
# picked for you (scripts/release-version.mjs): one step above the highest
# version the feed serves for those platforms, skipping versions that are
# already tagged or half-published; the bump is committed and tagged as the
# release commit. From a `v*` tag the tag's version is used as is, and the run
# refuses if it is already published for those platforms.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build and publish
        type: choice
        default: all
        options:
          - all
          - windows+linux
          - windows
          - mac
          - linux
      bump:
        description: Version step when releasing from main (the version is picked from the feed)
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # No job needs node_modules/electron/dist: electron-builder downloads its
  # own copy, and better-sqlite3 ships N-API prebuilds (no native rebuild).
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  # Runs first and gates everything: a dispatch from a feature branch builds
  # nothing, so unreviewed code can never reach the update channel.
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Only main or a version tag may release
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) echo "releasing from main" ;;
            refs/tags/v*) echo "releasing from tag $GITHUB_REF_NAME" ;;
            *)
              echo "::error::Releases publish only from main or a v* tag (got $GITHUB_REF)"
              exit 1
              ;;
          esac

      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          ACTUAL="$(node -p "require('./package.json').version")"
          echo "tag=$TAG expected=$EXPECTED package.json=$ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Tag $TAG does not match package.json version $ACTUAL"
            exit 1
          fi

  version:
    name: Pick the version
    needs: [guard]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pick, bump and tag
        id: pick
        env:
          PLATFORMS: ${{ inputs.platforms }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            node scripts/release-version.mjs --platforms="$PLATFORMS" --check="$V"
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          V="$(node scripts/release-version.mjs --platforms="$PLATFORMS" --bump="$BUMP")"
          CUR="$(node -p "require('./package.json').version")"
          git config user.name "Pankaj Yadav"
          git config user.email "pankajyadav05@users.noreply.github.com"
          if [ "$V" != "$CUR" ]; then
            node scripts/release.mjs "$V"
            git commit -m "v$V"
            # Fails (and stops the release) if main moved since this run started.
            git push origin HEAD:main
          fi
          if ! git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            git tag "v$V"
            git push origin "refs/tags/v$V"
          fi
          echo "::notice::Releasing $V for $PLATFORMS"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "ref=refs/tags/v$V" >> "$GITHUB_OUTPUT"

  verify:
    name: Typecheck + tests
    needs: [guard, version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  build-windows:
    needs: [verify, version]
    if: contains(fromJSON('["all","windows+linux","windows"]'), inputs.platforms)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # No native rebuild: electron-builder.yml sets npmRebuild: false and
      # better-sqlite3's N-API prebuild is used as shipped.
      - name: Build Windows
        run: pnpm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*
          if-no-files-found: error

  # Launch the portable exe and prove the app boots and opens plasma.db.
  smoke-windows:
    needs: [build-windows]
    runs-on: windows-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release

      - name: Launch app and verify plasma.db
        shell: pwsh
        run: |
          $exe = (Get-ChildItem release -Filter 'Plasma-Portable-*.exe' | Select-Object -First 1).FullName
          $userData = Join-Path $env:RUNNER_TEMP 'plasma-smoke'
          New-Item -ItemType Directory -Force $userData | Out-Null
          $env:PLASMA_USER_DATA = $userData
          $env:PLASMA_DISABLE_UPDATER = '1'
          $proc = Start-Process -FilePath $exe -PassThru
          $db = Join-Path $userData 'plasma.db'
          $ready = $false
          for ($i = 0; $i -lt 90; $i++) {
            if (Test-Path $db) { $ready = $true; break }
            if ($proc.HasExited) { break }
            Start-Sleep -Seconds 1
          }
          Get-Process -Name 'Plasma*' -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ready) {
            Write-Host "::error::plasma.db was not created within 90s of launch"
            $log = Join-Path $userData 'logs/main.log'
            if (Test-Path $log) { Get-Content $log }
            exit 1
          }
          Write-Host "plasma.db created: $((Get-Item $db).Length) bytes"

  build-macos:
    needs: [verify, version]
    if: contains(fromJSON('["all","mac"]'), inputs.platforms)
    runs-on: macos-latest
    env:
      # Unsigned builds (identity: null in electron-builder.yml)
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build macOS
        run: pnpm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/*
          if-no-files-found: error

  # Launch the packaged app on a real Mac runner (macos-latest is Apple
  # Silicon, the only Mac arch shipped) and prove it boots and opens its
  # SQLite database: if better-sqlite3's .node prebuild mismatches the arch,
  # the app crashes before plasma.db ever appears.
  smoke-macos:
    needs: [build-macos]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    runs-on: macos-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release

      - name: Unpack Plasma.app (${{ matrix.arch }})
        run: |
          ZIP=$(ls release/Plasma-*-${{ matrix.arch }}.zip)
          echo "Unpacking $ZIP"
          ditto -x -k "$ZIP" "smoke-${{ matrix.arch }}"
          xattr -cr "smoke-${{ matrix.arch }}/Plasma.app" || true

      # A runner may launch a bundle whose signature no longer matches its
      # code (3.1.2 did) while a stricter Mac kills it on first launch, so
      # check the signature itself, every nested binary included.
      - name: Code signature is intact
        run: |
          codesign --verify --deep --strict --verbose=2 "smoke-${{ matrix.arch }}/Plasma.app"
          codesign --verify --strict --verbose=2 "smoke-${{ matrix.arch }}/Plasma.app/Contents/Frameworks/Electron Framework.framework"

      - name: Launch app and verify plasma.db
        run: |
          APP="smoke-${{ matrix.arch }}/Plasma.app/Contents/MacOS/Plasma"
          USER_DATA="$HOME/Library/Application Support/Plasma"
          DB="$USER_DATA/plasma.db"
          rm -rf "$USER_DATA"

          "$APP" &
          APP_PID=$!

          # db.ts opens userData/plasma.db and runs migrations at startup.
          # Poll until the connections table exists (migrations complete).
          READY=""
          for i in $(seq 1 90); do
            if [ -f "$DB" ] && sqlite3 "$DB" ".tables" 2>/dev/null | grep -q connections; then
              READY=1
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::Plasma exited before opening plasma.db"
              break
            fi
            sleep 1
          done

          if [ -z "$READY" ]; then
            echo "::error::plasma.db was not created and migrated within 90s of launch"
            kill "$APP_PID" 2>/dev/null || true
            exit 1
          fi

          # Prove the file is a healthy SQLite database, opened by the app's
          # own bundled better-sqlite3 build.
          sqlite3 "$DB" "PRAGMA integrity_check;" | grep -q '^ok$'
          echo "integrity_check: ok"
          echo "tables: $(sqlite3 "$DB" '.tables')"
          kill "$APP_PID" 2>/dev/null || true

      - name: Dump app log
        if: always()
        run: |
          LOG="$HOME/Library/Logs/Plasma/main.log"
          if [ -f "$LOG" ]; then cat "$LOG"; else echo "no app log at $LOG"; fi

  build-linux:
    needs: [verify, version]
    if: contains(fromJSON('["all","windows+linux","linux"]'), inputs.platforms)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Linux (AppImage + deb)
        run: pnpm run dist:linux

      - name: Check Electron fuses on the packaged binary
        run: node scripts/verify-fuses.mjs release/linux-unpacked/plasma.bin

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: release/*
          if-no-files-found: error

  smoke-linux:
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release

      - name: Launch AppImage and verify plasma.db
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm1 libasound2t64 sqlite3 || sudo apt-get install -y xvfb libgbm1 libasound2 sqlite3
          chmod +x release/Plasma-*.AppImage
          export PLASMA_USER_DATA="$RUNNER_TEMP/plasma-smoke"
          export PLASMA_DISABLE_UPDATER=1
          mkdir -p "$PLASMA_USER_DATA"
          # No --no-sandbox: the bundled launcher must decide that itself
          # (Ubuntu 24.04+ blocks the sandbox for AppImages).
          xvfb-run -a release/Plasma-*.AppImage --appimage-extract-and-run &
          READY=""
          for i in $(seq 1 90); do
            if [ -f "$PLASMA_USER_DATA/plasma.db" ] && sqlite3 "$PLASMA_USER_DATA/plasma.db" ".tables" | grep -q connections; then
              READY=1
              break
            fi
            sleep 1
          done
          pkill -f Plasma || true
          if [ -z "$READY" ]; then
            echo "::error::plasma.db was not created and migrated within 90s of launch"
            cat "$PLASMA_USER_DATA/logs/main.log" 2>/dev/null || true
            exit 1
          fi
          echo "tables: $(sqlite3 "$PLASMA_USER_DATA/plasma.db" '.tables')"

  publish:
    needs: [guard, version, build-windows, smoke-windows, build-macos, smoke-macos, build-linux, smoke-linux]
    # Platforms left out are skipped jobs, not failures; anything that ran must
    # have passed. Belt and braces: `guard` already failed any other ref.
    if: >-
      !cancelled() && !failure() &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # Protect this environment (required reviewers) in the repo settings.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release/
        run: ls -lah release

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Signs latest*.yml with the ed25519 key and uploads <manifest>.sig;
      # refuses to overwrite an existing versioned artifact (see docs/release.md).
      - name: Upload to Cloudflare R2
        env:
          R2_ACCOUNT_ID: 945bc8f64778fda12f098a60e0ed122f
          R2_BUCKET: plasma
          R2_PUBLIC_BASE_URL: https://pub-05a2064511bc41689f299b542b07b67f.r2.dev
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PLASMA_UPDATE_SIGNING_KEY: ${{ secrets.PLASMA_UPDATE_SIGNING_KEY }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          case "$PLATFORMS" in
            mac) node scripts/upload-release.mjs --mac-only ;;
            linux) node scripts/upload-release.mjs --linux-only ;;
            *) node scripts/upload-release.mjs ;;
          esac

      # The site reads the feed at build time, and Vercel's own deploy (on the
      # version-bump push) runs before this upload. Rebuild it now that the
      # feed serves this version. Skipped when the secret is not set.
      - name: Redeploy the website
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK not set; redeploy the site by hand so it shows this version."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" > /dev/null
          echo "site redeploy triggered"

      # Every release gets its page, on the tag the version job made or used.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            release/Plasma-Setup-*.exe
            release/Plasma-Portable-*.exe
            release/Plasma-*.dmg
            release/Plasma-*.zip
            release/Plasma-*.AppImage
            release/Plasma-*.deb
            release/latest.yml
            release/latest-mac.yml
            release/latest-linux.yml
            release/*.blockmap
