name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    env:
      # Pure Node checks — no packaged app is launched in this job.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  build-windows:
    needs: [verify]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rebuild native deps for Electron
        run: pnpm exec electron-builder install-app-deps

      - name: Build Windows
        run: pnpm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*
          if-no-files-found: error

  build-macos:
    needs: [verify]
    runs-on: macos-latest
    env:
      # Unsigned builds (identity: null in electron-builder.yml)
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # No `install-app-deps` here: it would only rebuild the host arch while
      # dist:mac packages arm64 AND x64. electron-builder.yml sets
      # npmRebuild: true, so packaging rebuilds better-sqlite3 against each
      # target arch's Electron ABI itself.
      - name: Build macOS
        run: pnpm run dist:mac

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release/*
          if-no-files-found: error

  # Launch each packaged arch on a real Mac runner and prove the app boots
  # and opens its SQLite database. This is the end-to-end guard for the
  # per-arch native rebuild above: if better-sqlite3's bundled .node binary
  # mismatches the arch, the app crashes before plasma.db ever appears.
  # macos-latest is Apple Silicon; the x64 app runs under Rosetta 2
  # (preinstalled on GitHub's arm64 images).
  smoke-macos:
    needs: [build-macos]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release

      - name: Unpack Plasma.app (${{ matrix.arch }})
        run: |
          ZIP=$(ls release/Plasma-*-${{ matrix.arch }}.zip)
          echo "Unpacking $ZIP"
          ditto -x -k "$ZIP" "smoke-${{ matrix.arch }}"
          xattr -cr "smoke-${{ matrix.arch }}/Plasma.app" || true

      - name: Launch app and verify plasma.db
        run: |
          APP="smoke-${{ matrix.arch }}/Plasma.app/Contents/MacOS/Plasma"
          USER_DATA="$HOME/Library/Application Support/Plasma"
          DB="$USER_DATA/plasma.db"
          rm -rf "$USER_DATA"

          "$APP" &
          APP_PID=$!

          # db.ts opens userData/plasma.db and runs migrations at startup.
          # Poll until the connections table exists (migrations complete).
          READY=""
          for i in $(seq 1 90); do
            if [ -f "$DB" ] && sqlite3 "$DB" ".tables" 2>/dev/null | grep -q connections; then
              READY=1
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::Plasma exited before opening plasma.db"
              break
            fi
            sleep 1
          done

          if [ -z "$READY" ]; then
            echo "::error::plasma.db was not created and migrated within 90s of launch"
            kill "$APP_PID" 2>/dev/null || true
            exit 1
          fi

          # Prove the file is a healthy SQLite database, opened by the app's
          # own bundled better-sqlite3 build.
          sqlite3 "$DB" "PRAGMA integrity_check;" | grep -q '^ok$'
          echo "integrity_check: ok"
          echo "tables: $(sqlite3 "$DB" '.tables')"
          kill "$APP_PID" 2>/dev/null || true

      - name: Dump app log
        if: always()
        run: |
          LOG="$HOME/Library/Logs/Plasma/main.log"
          if [ -f "$LOG" ]; then cat "$LOG"; else echo "no app log at $LOG"; fi

  publish:
    needs: [build-windows, build-macos, smoke-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify package.json version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          ACTUAL="$(node -p "require('./package.json').version")"
          echo "tag=$TAG expected=$EXPECTED package.json=$ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Tag $TAG does not match package.json version $ACTUAL"
            exit 1
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release/
        run: ls -lah release

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Upload to Cloudflare R2
        env:
          R2_ACCOUNT_ID: 945bc8f64778fda12f098a60e0ed122f
          R2_BUCKET: plasma
          R2_PUBLIC_BASE_URL: https://pub-05a2064511bc41689f299b542b07b67f.r2.dev
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: pnpm run release:upload

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/Plasma-Setup-*.exe
            release/Plasma-Portable-*.exe
            release/Plasma-*.dmg
            release/Plasma-*.zip
            release/latest.yml
            release/latest-mac.yml
            release/*.blockmap
